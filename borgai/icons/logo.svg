<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borgaiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Hexagon outline -->
  <polygon
    points="200,30 344,110 344,290 200,370 56,290 56,110"
    fill="none"
    stroke="url(#borgaiGradient)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- AI text uprostred -->
  <text
    x="200"
    y="250"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="bold"
    font-size="170"
    fill="url(#borgaiGradient)"
  >AI</text>
</svg>
