<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BorgAI" />
<meta name="theme-color" content="#151920" />
<title>BorgAI</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root {
    --accent-start: #00f2fe;
    --accent-end: #4facfe;
    --bg-dark: #14171d;
    --bg-panel: #1d222b;
    --bg-elevated: #262c37;
    --fg-text: #eef4fb;
    --fg-muted: #8fa1b8;
    --border-subtle: rgba(255, 255, 255, 0.07);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
    background: var(--bg-dark);
    color: var(--fg-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    padding-top: calc(12px + var(--safe-top));
    background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    z-index: 5;
  }
  header img.logo {
    width: 28px;
    height: 28px;
    display: block;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
  }
  header .title {
    flex: 1;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
    color: #06141c;
  }
  header .settings-btn {
    background: rgba(6, 20, 28, 0.1);
    border: none;
    border-radius: 10px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s ease;
  }
  header .settings-btn:active { background: rgba(6, 20, 28, 0.2); }
  header .settings-btn svg { width: 19px; height: 19px; stroke: #06141c; }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
  }
  #chat::-webkit-scrollbar { width: 5px; }
  #chat::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }

  .bubble {
    max-width: 80%;
    padding: 11px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble.ai {
    align-self: flex-start;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
    color: #06141c;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 11px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Input row ---------- */
  #inputRow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: calc(10px + var(--safe-bottom));
    background: var(--bg-panel);
    border-top: 1px solid var(--border-subtle);
  }
  #msgInput {
    flex: 1;
    border: 1px solid var(--border-subtle);
    outline: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px; /* 16px zabraňuje automatickému zoomu na iOS */
    background: var(--bg-elevated);
    color: var(--fg-text);
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  #msgInput:focus { border-color: var(--accent-end); }
  #msgInput::placeholder { color: var(--fg-muted); }

  #sendBtn {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    height: 44px;
    font-weight: 700;
    font-size: 14.5px;
    background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
    color: #06141c;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #sendBtn:active { transform: scale(0.96); }
  #sendBtn:disabled { opacity: 0.5; }

  /* ---------- Settings ---------- */
  #settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 14, 0.55);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 20;
  }
  #settingsOverlay.open { opacity: 1; pointer-events: auto; }

  #settingsPanel {
    background: var(--bg-panel);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--border-subtle);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px;
    padding-bottom: calc(22px + var(--safe-bottom));
    transform: translateY(12px);
    transition: transform 0.18s ease;
  }
  #settingsOverlay.open #settingsPanel { transform: translateY(0); }

  #settingsPanel .handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border-subtle);
    margin: 0 auto 16px auto;
  }
  #settingsPanel h2 {
    margin: 0 0 18px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--fg-text);
  }
  .settings-row { margin-bottom: 16px; }
  .settings-row:last-of-type { margin-bottom: 0; }
  .settings-row label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg-muted);
    margin-bottom: 5px;
  }
  .settings-row select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-elevated);
    color: var(--fg-text);
    font-size: 14.5px;
    font-family: inherit;
    appearance: none;
  }
  .settings-row .value { font-size: 14.5px; color: var(--fg-text); }
  .settings-row a { color: var(--accent-end); text-decoration: none; font-weight: 600; }
  .settings-row a:active { opacity: 0.7; }

  #closeSettings {
    display: block;
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14.5px;
    background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
    color: #06141c;
    cursor: pointer;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" src="icons/logo.svg" alt="BorgAI logo" />
    <span class="title">BorgAI</span>
    <button class="settings-btn" id="settingsBtn" aria-label="Nastavení">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="msgInput" type="text" placeholder="Napiš zprávu..." autocomplete="off" autocapitalize="sentences" />
    <button id="sendBtn">Odeslat</button>
  </div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <div class="handle"></div>
    <h2>Nastavení</h2>
    <div class="settings-row">
      <label>Model</label>
      <select disabled>
        <option selected>BorgAI v1.2</option>
      </select>
    </div>
    <div class="settings-row">
      <label>Vývojář</label>
      <div class="value">Borgo Industries</div>
    </div>
    <div class="settings-row">
      <label>Poslední aktualizace</label>
      <div class="value">31.8.2026</div>
    </div>
    <div class="settings-row">
      <label>Web</label>
      <div class="value"><a href="https://dandrat.github.io/BorgOS/" target="_blank" rel="noopener">BorgOS</a></div>
    </div>
    <button id="closeSettings">Zavřít</button>
  </div>
</div>

<script>
  // Adresa tvého proxy serveru - uprav podle nasazení
  const PROXY_URL = "https://tvuj-proxy-server.cz/api/chat";
  const APP_SECRET = ""; // musí odpovídat APP_SECRET na serveru, pokud ho používáš

  const chat = document.getElementById("chat");
  const input = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  let history = [];

  function addBubble(text, role) {
    const div = document.createElement("div");
    div.className = "bubble " + (role === "user" ? "user" : "ai");
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addBubble(text, "user");
    history.push({ role: "user", content: text });

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
    sendBtn.disabled = true;

    try {
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(APP_SECRET ? { "x-app-secret": APP_SECRET } : {}),
        },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addBubble(data.error || "BorgAI momentálně neodpovídá.", "ai");
        return;
      }
      addBubble(data.reply, "ai");
      history.push({ role: "assistant", content: data.reply });
    } catch (e) {
      typing.remove();
      addBubble("Nepodařilo se spojit s BorgAI. Zkontroluj připojení.", "ai");
    } finally {
      sendBtn.disabled = false;
      input.focus({ preventScroll: true });
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const closeSettings = document.getElementById("closeSettings");

  settingsBtn.addEventListener("click", () => settingsOverlay.classList.add("open"));
  closeSettings.addEventListener("click", () => settingsOverlay.classList.remove("open"));
  settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove("open");
  });

  addBubble("Ahoj! Jsem BorgAI. Jak ti mohu pomoct?", "ai");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
