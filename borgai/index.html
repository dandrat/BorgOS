<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BorgAI" />
<title>BorgAI</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root {
    --accent-start: #00f2fe;
    --accent-end: #4facfe;
    --bg-dark: #1b1f26;
    --bg-panel: #242933;
    --fg-text: #e6f1ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg-dark); color: var(--fg-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header {
    background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
    color: #04141a; font-weight: 700; padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    font-size: 17px;
    display: flex; align-items: center; gap: 10px;
  }
  header img.logo { width: 26px; height: 26px; }
  header .title { flex: 1; }
  header .settings-btn {
    background: none; border: none; padding: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  header .settings-btn svg { width: 22px; height: 22px; stroke: #04141a; }

  #settingsOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  #settingsOverlay.open { display: flex; }
  #settingsPanel {
    background: var(--bg-panel); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  #settingsPanel h2 {
    margin: 0 0 16px 0; font-size: 18px;
    background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .settings-row { margin-bottom: 14px; }
  .settings-row label { display: block; font-size: 12px; color: #9fb3c8; margin-bottom: 4px; }
  .settings-row select {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #1b1f26; color: var(--fg-text); font-size: 14px;
  }
  .settings-row .value { font-size: 15px; }
  .settings-row a { color: var(--accent-end); text-decoration: none; }
  #closeSettings {
    display: block; margin-top: 18px; width: 100%; padding: 12px; border: none;
    border-radius: 10px; font-weight: 700; background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
    color: #04141a;
  }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 10px 12px; border-radius: 14px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; }
  .bubble.ai { align-self: flex-start; background: var(--bg-panel); border-bottom-left-radius: 4px; }
  .bubble.user {
    align-self: flex-end; background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
    color: #04141a; border-bottom-right-radius: 4px;
  }
  #inputRow {
    display: flex; gap: 8px; padding: 10px; background: var(--bg-panel);
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  #msgInput {
    flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 15px;
    background: #1b1f26; color: var(--fg-text);
  }
  #sendBtn {
    border: none; border-radius: 10px; padding: 0 18px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent-start), var(--accent-end)); color: #04141a;
  }
  .typing { align-self: flex-start; color: #9fb3c8; font-size: 13px; padding-left: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" src="icons/logo.svg" alt="BorgAI logo" />
    <span class="title">BorgAI</span>
    <button class="settings-btn" id="settingsBtn" aria-label="Nastavení">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="msgInput" type="text" placeholder="Napiš zprávu..." autocomplete="off" />
    <button id="sendBtn">Odeslat</button>
  </div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h2>Nastavení</h2>
    <div class="settings-row">
      <label>Model</label>
      <select disabled>
        <option selected>BorgAI v1.2</option>
      </select>
    </div>
    <div class="settings-row">
      <label>Vývojář</label>
      <div class="value">Borgo Industries</div>
    </div>
    <div class="settings-row">
      <label>Poslední aktualizace</label>
      <div class="value">31.8.2026</div>
    </div>
    <div class="settings-row">
      <label>Web</label>
      <div class="value"><a href="https://dandrat.github.io/BorgOS/" target="_blank" rel="noopener">BorgOS</a></div>
    </div>
    <button id="closeSettings">Zavřít</button>
  </div>
</div>

<script>
  // Adresa tvého proxy serveru - uprav podle nasazení
  const PROXY_URL = "https://aiserver-p0qe.onrender.com/api/chat";
  const APP_SECRET = "7q5j4d3j95p4a2z84r5d6g1cv97jds4";

  const chat = document.getElementById("chat");
  const input = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  let history = [];

  function addBubble(text, role) {
    const div = document.createElement("div");
    div.className = "bubble " + (role === "user" ? "user" : "ai");
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addBubble(text, "user");
    history.push({ role: "user", content: text });

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "BorgAI píše...";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
    sendBtn.disabled = true;

    try {
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(APP_SECRET ? { "x-app-secret": APP_SECRET } : {}),
        },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addBubble(data.error || "BorgAI momentálně neodpovídá.", "ai");
        return;
      }
      addBubble(data.reply, "ai");
      history.push({ role: "assistant", content: data.reply });
    } catch (e) {
      typing.remove();
      addBubble("Borgoš asi chrápe, nech ho být.", "ai");
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const closeSettings = document.getElementById("closeSettings");

  settingsBtn.addEventListener("click", () => settingsOverlay.classList.add("open"));
  closeSettings.addEventListener("click", () => settingsOverlay.classList.remove("open"));
  settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove("open");
  });

  addBubble("Ahoj! Jsem BorgAI. Jak ti mohu pomoct?", "ai");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
